global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "app"
    static_configs:
      - targets:
          - "app:3000"
    metrics_path: "/metrics"
    scrape_interval: 5s

  - job_name: "nginx"
    static_configs:
      - targets:
          - "nginx:80"
    metrics_path: "/nginx_status"

  - job_name: "mongodb"
    static_configs:
      - targets:
          - "mongodb:27017"

  - job_name: "postgresql"
    static_configs:
      - targets:
          - "postgresql:5432"

  - job_name: "redis"
    static_configs:
      - targets:
          - "redis:6379"