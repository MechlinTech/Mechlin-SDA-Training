# -----------------------------------------------------------------------------
# Purpose:
# Creates Persistent Volumes (PVs) for storing application logs and uploaded
# files. These volumes retain data even if Pods are restarted or recreated.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: PersistentVolume

metadata:
  name: app-logs-pv

  labels:
    app: sda-training
    component: logs

spec:
  capacity:
    storage: 10Gi

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs

  nfs:
    server: nfs-server.example.com
    path: /exports/app-logs

---
apiVersion: v1
kind: PersistentVolume

metadata:
  name: app-uploads-pv

  labels:
    app: sda-training
    component: uploads

spec:
  capacity:
    storage: 50Gi

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs

  nfs:
    server: nfs-server.example.com
    path: /exports/app-uploads