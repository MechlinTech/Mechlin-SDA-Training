name: AI Productivity CI

on:
  push:
    branches:
      - main
      - feature/day27

  pull_request:
    branches:
      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week4/day27/backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm test --if-present

  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week4/day27/frontend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build