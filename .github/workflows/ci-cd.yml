name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: 20

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sda_training
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Tests
        run: npm test

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t sda-training -f week3/day16/Dockerfile week3/day16

  deploy:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes Files
        run: |
          test -f week3/day17/k8s/deployment.yaml
          test -f week3/day17/k8s/service.yaml
          test -f week3/day17/k8s/ingress.yaml
          test -f week3/day17/k8s/configmap.yaml
          test -f week3/day17/k8s/secret.yaml

      - name: List Kubernetes Resources
        run: ls -R week3/day17/k8s

      - name: Validation Successful
        run: echo "Kubernetes manifests validated successfully."

  completed:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs:
      - deploy

    steps:
      - name: Success
        run: echo "CI/CD Pipeline completed successfully."