<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Demo</title>
    <link rel="stylesheet" href="tailwind.css">
</head>

<body class="bg-slate-100 min-h-screen">

    <header class="bg-primary text-white p-6 shadow-md">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-3xl font-bold">Tailwind CSS Dashboard</h1>
            <p class="mt-2 text-blue-100">
                Day 2 HTML5 & Advanced CSS
            </p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

            <article class="bg-white rounded-lg shadow-md p-6 hover:shadow-xl transition">
                <h2 class="text-gray-500 text-sm font-medium">Total Users</h2>
                <p class="text-3xl font-bold mt-2 text-gray-900">1,234</p>
                <p class="text-green-600 mt-2">+12.5%</p>
            </article>

            <article class="bg-white rounded-lg shadow-md p-6 hover:shadow-xl transition">
                <h2 class="text-gray-500 text-sm font-medium">Revenue</h2>
                <p class="text-3xl font-bold mt-2 text-gray-900">$45,678</p>
                <p class="text-green-600 mt-2">+8.2%</p>
            </article>

            <article class="bg-white rounded-lg shadow-md p-6 hover:shadow-xl transition">
                <h2 class="text-gray-500 text-sm font-medium">Orders</h2>
                <p class="text-3xl font-bold mt-2 text-gray-900">567</p>
                <p class="text-green-600 mt-2">+5.4%</p>
            </article>

            <article class="bg-white rounded-lg shadow-md p-6 hover:shadow-xl transition">
                <h2 class="text-gray-500 text-sm font-medium">Conversion Rate</h2>
                <p class="text-3xl font-bold mt-2 text-gray-900">4.8%</p>
                <p class="text-red-600 mt-2">-1.2%</p>
            </article>

        </section>

    </main>

</body>
</html>
