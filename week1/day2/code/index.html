<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Advanced responsive dashboard">
    <meta name="keywords" content="dashboard, analytics, users, reports">
    <meta name="author" content="SDA Training">

    <title>Advanced Dashboard</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="nav">

            <div class="nav-brand">
                <h1>Dashboard</h1>
            </div>

            <ul class="nav-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#analytics">Analytics</a></li>
                <li><a href="#settings">Settings</a></li>
            </ul>

        </nav>
    </header>


    <!-- Main Content -->
    <main class="main">

        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav" aria-label="Sidebar Navigation">

                <ul>
                    <li>
                        <a href="#dashboard">Dashboard</a>
                    </li>

                    <li>
                        <a href="#users">Users</a>
                    </li>

                    <li>
                        <a href="#reports">Reports</a>
                    </li>
                </ul>

            </nav>
        </aside>


        <!-- Dashboard Content -->
        <section class="content" id="dashboard">

            <h2>Dashboard Overview</h2>

            <div class="dashboard-grid">

                <!-- Card 1 -->
                <article class="card">
                    <h3>Total Users</h3>
                    <p class="metric">1,234</p>
                </article>

                <!-- Card 2 -->
                <article class="card">
                    <h3>Revenue</h3>
                    <p class="metric">$45,678</p>
                </article>

                <!-- Card 3 -->
                <article class="card">
                    <h3>Orders</h3>
                    <p class="metric">567</p>
                </article>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Advanced Dashboard. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
