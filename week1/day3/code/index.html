
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Advanced JavaScript Dashboard">

    <title>JavaScript Advanced Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px;
        }

        header h1 {
            text-align: center;
        }

        main {
            padding: 30px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .content-header button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-height: 350px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chart-container h3 {
            margin-bottom: 15px;
        }

        .chart-container canvas {
            width: 100% !important;
            height: 280px !important;
        }

        .performance-panel {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .metric-item {
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .metric-name {
            font-weight: bold;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            main {
                padding: 15px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Advanced JavaScript Dashboard</h1>
    </header>

    <main>

        <div class="content-header">
            <h2>Dashboard Overview</h2>
        </div>

        <section class="content">

        </section>

    </main>

    <script type="module" src="./app.js"></script>

</body>
</html>
